<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajout d'un nouveau véhicule</title>
</head>

<body bgcolor="grey">

    <form>
        <h1>Ajout d'un nouveau véhicule</h1>

        <table border="0" width="60%">

            <tr>
                <td>
                    <label for="marque">Marque :</label>
                </td>
                <td>
                    <select id="marque" name="marque">
                        <option value="peugeot">Peugeot</option>
                        <option value="mercedes">Mercedes</option>
                        <option value="renault">Renault</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="immatriculation">Immatriculation :</label>
                </td>
                <td>
                    <input type="text" id="immatriculation" name="immatriculation">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="couleur">Couleur :</label>
                </td>
                <td>
                    <input type="text" id="couleur" name="couleur">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="date_immatriculation">Date d'immatriculation :</label>
                </td>
                <td>
                    <input type="date" id="date_immatriculation" name="date_immatriculation">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="kilometrage">Kilométrage :</label>
                </td>
                <td>
                    <input type="number" id="kilometrage" name="kilometrage" min="0">
                </td>
            </tr>

            <tr>
                <td>
                    <label>État :</label>
                </td>
                <td>
                    <input type="radio" id="occasion" name="etat" value="occasion">
                    <label for="occasion">Occasion</label>

                    <input type="radio" id="neuf" name="etat" value="neuf">
                    <label for="neuf">Neuf</label>
                </td>
            </tr>

            <tr>
                <td>
                    <label>Carburant :</label>
                </td>
                <td>
                    <input type="radio" id="hybride" name="carburant" value="hybride">
                    <label for="hybride">Hybride</label>

                    <input type="radio" id="electrique" name="carburant" value="electrique">
                    <label for="electrique">Électrique</label>

                    <input type="radio" id="diesel" name="carburant" value="diesel">
                    <label for="diesel">Diesel</label>

                    <input type="radio" id="essence" name="carburant" value="essence">
                    <label for="essence">Essence</label>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="boite">Boîte de vitesses :</label>
                </td>
                <td>
                    <select id="boite" name="boite">
                        <option value="manuelle">Manuelle</option>
                        <option value="automatique">Automatique</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="portes">Nombre de portes :</label>
                </td>
                <td>
                    <input type="number" id="portes" name="portes" min="2" max="5">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="tarif">Tarif de location journalier (€) :</label>
                </td>
                <td>
                    <input type="number" id="tarif" name="tarif" min="0" step="0.01">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="disponibilite">Disponibilité :</label>
                </td>
                <td>
                    <select id="disponibilite" name="disponibilite">
                        <option value="disponible">Disponible</option>
                        <option value="indisponible">Indisponible</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="submit" value="Enregistrer">
                    <input type="reset" value="Annuler">
                </td>
            </tr>

        </table>
    </form>
        <a href="index.html">Menu</a>
       <footer>
        <p>&copy; 2026 Agence Méditerranée - Location de véhicules</p>
    </footer>
</body>
</html>
