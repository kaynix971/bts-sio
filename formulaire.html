<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body bgcolor="pink">
	<header>  
    <h1>Inscription d'un Nouveau client</h1>  
</header>

<section>  
    <form action="#" method="post" aria-label="Formulaire d'inscription">

        <label for="nom">Nom :</label>  
        <input type="text" id="nom" name="nom">  
        <br>
        <br>

        <label for="prenom">Prénom :</label>  
        <input type="text" id="prenom" name="prenom">  
        <br>
        <br>

        <label for="date_naissance">Date de naissance :</label>  
        <input type="date" id="date_naissance" name="date_naissance">  
        <br>
        <br>

        <label for="email">Adresse mail :</label>  
        <input type="email" id="email" name="email">  
        <br>
        <br>

        <label for="mdp">Mot de passe :</label>  
        <input type="password" id="mdp" name="mdp">  
        <br>
        <br>

        <label for="permis">Numéro de permis :</label>  
        <input type="text" id="permis" name="permis">  
        <br>
        <br>

        <label for="anciennete">Nombre d'années d'ancienneté (permis) :</label>  
        <input type="number" id="anciennete" name="anciennete" min="0" max="80">  
        <br>
        <br>

        <label for="ville">Ville :</label>  
        <select id="ville" name="ville">  
            <option value="paris">Paris</option>  
            <option value="versailles">Versailles</option>  
            <option value="creteil">Créteil</option>  
        </select>  
        <br>
        <br>

        <label for="adresse">Adresse du client :</label>  
        <textarea id="adresse" name="adresse" rows="4" cols="30"></textarea>  
        <br>
        <br>

        <p>Situation matrimoniale :</p>  
        <label for="marie_oui">  
            <input type="radio" id="marie_oui" name="situation_matrimoniale" value="oui"> Marié  
        </label>  
        <label for="marie_non">  
            <input type="radio" id="marie_non" name="situation_matrimoniale" value="non"> Non marié  
        </label>  
        <br>
        <br>

        <p>Préférence de voiture :</p>  
        <label for="pref_auto">  
            <input type="checkbox" id="pref_auto" name="preference_auto" value="auto">  
            Automatique  
        </label>  
        <label for="pref_manuelle">  
            <input type="checkbox" id="pref_manuelle" name="preference_manuelle" value="manuelle">  
            Manuelle  
        </label>  
        <br>
        <br>

        <button type="submit">Enregistrer</button>  
        <button type="reset">Annuler</button>  
    </form>  
</section>
<br>
<br>
<footer>  
    <p>© 2026 Agence Méditerranée - Location de véhicules</p>  
</footer>
<a href="index.html">Menu</a><br>
</body>
</html>
